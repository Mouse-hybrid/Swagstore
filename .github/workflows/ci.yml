# ─────────────────────────────────────────────────────────────
# SwagStore – CI/CD Pipeline (Đã tích hợp Cypress Automation Lab 5)
# Triggers: push / PR to any branch
# ─────────────────────────────────────────────────────────────
name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Tự động hủy các luồng đang chạy dở nếu có commit mới được push lên để tiết kiệm tài nguyên
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. LINT (Kiểm tra cú pháp Node.js) ─────────────────────
  lint:
    name: Lint (Node syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax (node --check)
        run: |
          find . -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.github/*" \
            -exec node --check {} \;

  # ── 2. UNIT + INTEGRATION TESTS (Test hệ thống Swagstore) ──
  test:
    name: Test (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 3. LAB 5: CYPRESS E2E TESTS (Tích hợp kiểm thử tự động) ──
  e2e-cypress:
    name: Cypress E2E Automation (Lab 5)
    needs: lint # Chạy sau khi bước Lint thành công
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          # Chỉ định chính xác đường dẫn đến thư mục chứa mã nguồn Cypress Lab 5 của bạn
          working-directory: lab5-automation 
          browser: chrome
          headless: true

      # Nếu kịch bản Cypress có bước nào bị lỗi, tự động tải ảnh và video lỗi lên GitHub
      - name: Upload Cypress Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-error-logs
          path: |
            lab5-automation/cypress/screenshots
            lab5-automation/cypress/videos

  # ── 4. BUILD VERIFICATION (Xác minh đóng gói) ──────────────
  build:
    name: Build verification
    # ĐIỀU KIỆN MỚI: Chỉ build khi cả Unit Test hệ thống và Cypress Automation đều PASSED
    needs: [test, e2e-cypress] 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps only
        run: npm ci --omit=dev

      - name: Verify app starts and exits cleanly
        run: |
          timeout 5 node -e "
            const createApp = require('./app');
            const app = createApp();
            const server = app.listen(0, () => {
              console.log('✅ App started on port', server.address().port);
              server.close(() => process.exit(0));
            });
          " || true

      - name: Create release archive
        run: |
          mkdir -p dist
          zip -r dist/swagstore.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude "coverage/*" \
            --exclude "dist/*" \
            --exclude "*.bak"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagstore-build-${{ github.sha }}
          path: dist/swagstore.zip
          retention-days: 14

  # ── 5. DEPLOY (Triển khai ứng dụng lên Production) ─────────
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://swagstore.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps
        run: npm ci --omit=dev

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: swagstore-build-${{ github.sha }}
          path: dist/

      - name: ✅ Deploy step placeholder
        run: |
          echo "Artifact ready at dist/swagstore.zip"
          echo "Uncomment the deploy option that matches your host."
          echo "Commit SHA: ${{ github.sha }}"