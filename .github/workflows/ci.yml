  #       uses: cypress-io/github-action@v6
  #       with:
  #         working-directory: lab5-automation 
  #         browser: chrome
  #         headless: true
  #     - name: Upload Cypress Artifacts on Failure
  #       uses: actions/upload-artifact@v4
  #       if: failure()
  #       with:
  #         name: cypress-error-logs
  #         path: |
  #           lab5-automation/cypress/screenshots
  #           lab5-automation/cypress/videos

  # ── 3b. LAB 5: PLAYWRIGHT E2E TESTS (Tạm ẩn luồng test Lab 5) ──
  # e2e-playwright:
  #   name: Playwright E2E Automation (Lab 5)
  #   needs: lint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #     - name: Setup Node.js 20
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #     - name: Install dependencies
  #       run: npm ci
  #       working-directory: lab5-automation
  #     - name: Install Playwright Browsers
  #       run: npx playwright install --with-deps
  #       working-directory: lab5-automation
  #     - name: Run Playwright tests
  #       run: npx playwright test
  #       working-directory: lab5-automation
  #     - name: Upload Playwright Report on Failure
  #       uses: actions/upload-artifact@v4
  #       if: failure()
  #       with:
  #         name: playwright-report
  #         path: lab5-automation/playwright-report/
  #         retention-days: 7

  # ── 4. BUILD VERIFICATION (Xác minh đóng gói) ──────────────
  build:
    name: Build verification
    # ĐÃ SỬA: Chỉ cần đợi duy nhất luồng test hệ thống chính thành công, loại bỏ e2e-cypress và e2e-playwright
    needs: [test] 
    if: always() && !cancelled() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps only
        run: npm ci --omit=dev

      - name: Verify app starts and exits cleanly
        run: |
          timeout 5 node -e "
            const createApp = require('./app');
            const app = createApp();
            const server = app.listen(0, () => {
              console.log('✅ App started on port', server.address().port);
              server.close(() => process.exit(0));
            });
          " || true

      - name: Create release archive
        run: |
          mkdir -p dist
          zip -r dist/swagstore.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude "coverage/*" \
            --exclude "dist/*" \
            --exclude "*.bak"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagstore-build-${{ github.sha }}
          path: dist/swagstore.zip
          retention-days: 14

  # ── 5. DEPLOY (Triển khai ứng dụng lên Production) ─────────
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.result == 'success'

    environment:
      name: production
      url: https://swagstore.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps
        run: npm ci --omit=dev

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: swagstore-build-${{ github.sha }}
          path: dist/

      - name: ✅ Deploy step placeholder
        run: |
          echo "Artifact ready at dist/swagstore.zip"
          echo "Uncomment the deploy option that matches your host."
          echo "Commit SHA: ${{ github.sha }}"