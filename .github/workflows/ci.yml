# ─────────────────────────────────────────────────────────────
# SwagStore – CI/CD Pipeline (Chỉ giữ lại luồng Deploy SwagStore chính)
# Triggers: push / PR to any branch
# ─────────────────────────────────────────────────────────────
name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Tự động hủy các luồng đang chạy dở nếu có commit mới được push lên để tiết kiệm tài nguyên
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. LINT (Kiểm tra cú pháp Node.js) ─────────────────────
  lint:
    name: Lint (Node syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JS syntax (node --check)
        run: |
          find . -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.github/*" \
            -exec node --check {} \;

  # ── 2. UNIT + INTEGRATION TESTS (Test hệ thống Swagstore) ──
  test:
    name: Test (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── 3. LAB 5: CYPRESS E2E TESTS (Tạm ẩn luồng test Lab 5) ──
